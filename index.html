<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sprachheft — A1 Deutsch Trainer</title>
<meta name="description" content="A German A1 course: vocabulary, grammar lessons and practice quizzes, installable as an app.">
<meta name="theme-color" content="#1E2A44">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sprachheft">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper: #EAE7DD;
  --paper-raised: #F4F2EA;
  --ink: #1E2A44;
  --ink-soft: #4A5670;
  --line: #C9C4B4;
  --yellow: #F0AE1E;
  --yellow-deep: #C98A0B;
  --red: #B23A2E;
  --green: #3D7A5C;
  --sans: 'Space Grotesk', system-ui, sans-serif;
  --serif: 'Source Serif 4', Georgia, serif;
  --mono: 'IBM Plex Mono', 'Courier New', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    linear-gradient(var(--paper) 1px, transparent 1px) 0 0/100% 32px,
    var(--paper);
  color:var(--ink);
  font-family:var(--serif);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--yellow); color:var(--ink);}
a{color:inherit;}

button{
  font-family:var(--sans);
  cursor:pointer;
  border:1.5px solid var(--ink);
  background:var(--paper-raised);
  color:var(--ink);
  border-radius:3px;
}
button:focus-visible, [tabindex]:focus-visible, input:focus-visible{
  outline:3px solid var(--yellow-deep);
  outline-offset:2px;
}

/* ---------- App shell ---------- */
#app{
  display:flex;
  min-height:100vh;
  max-width:1280px;
  margin:0 auto;
}

/* ---------- Sidebar: card-index tabs ---------- */
#sidebar{
  width:220px;
  flex-shrink:0;
  padding:20px 0 20px 16px;
  position:sticky;
  top:0;
  align-self:flex-start;
  height:100vh;
  overflow-y:auto;
}
.brand{
  font-family:var(--sans);
  font-weight:700;
  font-size:1.05rem;
  letter-spacing:0.01em;
  padding:6px 14px 14px 4px;
  border-bottom:2px solid var(--ink);
  margin-bottom:10px;
}
.brand small{
  display:block;
  font-family:var(--serif);
  font-weight:400;
  font-style:italic;
  font-size:0.78rem;
  color:var(--ink-soft);
  margin-top:2px;
}
.tab-list{list-style:none; margin:0; padding:0;}
.tab-item{
  display:block;
  width:100%;
  text-align:left;
  padding:9px 10px 9px 12px;
  margin-bottom:3px;
  background:var(--paper);
  border:1.5px solid var(--ink);
  border-right:none;
  border-radius:4px 0 0 4px;
  font-family:var(--sans);
  font-size:0.83rem;
  font-weight:500;
  color:var(--ink-soft);
  display:flex;
  align-items:center;
  gap:8px;
  transform:translateX(6px);
  transition:transform .15s ease, background .15s ease;
}
.tab-item .num{
  font-family:var(--mono);
  font-size:0.75rem;
  color:var(--ink-soft);
  min-width:1.4em;
}
.tab-item:hover{transform:translateX(0px);}
.tab-item.active{
  background:var(--paper-raised);
  color:var(--ink);
  transform:translateX(0px);
  box-shadow:-3px 3px 0 rgba(30,42,68,0.08);
}
.tab-item.active .num{color:var(--yellow-deep);}
.tab-item.home{margin-bottom:14px;}

/* ---------- Main ---------- */
#main{
  flex:1;
  min-width:0;
  padding:28px 36px 60px 28px;
}

/* ---------- Home dashboard ---------- */
.home-header{margin-bottom:22px;}
.home-header h1{
  font-family:var(--sans);
  font-size:1.9rem;
  margin:0 0 6px 0;
  font-weight:700;
}
.home-header p{
  margin:0;
  color:var(--ink-soft);
  max-width:60ch;
  line-height:1.5;
}
.home-stats{
  display:flex; gap:22px; margin-top:14px; flex-wrap:wrap;
}
.stat{
  font-family:var(--mono);
}
.stat .n{font-size:1.5rem; font-weight:600; display:block;}
.stat .l{font-size:0.72rem; color:var(--ink-soft);}

.chapter-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(210px, 1fr));
  gap:14px;
  margin-top:22px;
}
.chapter-card{
  background:var(--paper-raised);
  border:1.5px solid var(--ink);
  border-radius:4px;
  padding:14px 14px 12px 14px;
  text-align:left;
  position:relative;
  display:flex;
  flex-direction:column;
  gap:8px;
  min-height:140px;
}
.chapter-card:hover{box-shadow:4px 4px 0 rgba(30,42,68,0.10);}
.chapter-card .cnum{
  font-family:var(--mono);
  font-size:0.72rem;
  color:var(--ink-soft);
}
.chapter-card .ctitle-de{
  font-family:var(--sans);
  font-weight:600;
  font-size:1rem;
  line-height:1.25;
}
.chapter-card .ctitle-en{
  font-size:0.82rem;
  color:var(--ink-soft);
  font-style:italic;
}
.chapter-card .cfoot{
  margin-top:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.stamp{
  width:44px;height:44px;border-radius:50%;
  border:2px solid var(--ink);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:0.72rem;font-weight:600;
  transform:rotate(-8deg);
  flex-shrink:0;
  background:var(--paper);
}
.stamp.done{border-color:var(--green); color:var(--green); background:#E3EFE8;}
.stamp.mid{border-color:var(--yellow-deep); color:var(--yellow-deep);}
.quota-pill{
  font-family:var(--mono);
  font-size:0.7rem;
  color:var(--ink-soft);
}

/* ---------- Chapter view ---------- */
.chapter-head{
  border-bottom:2px solid var(--ink);
  padding-bottom:14px;
  margin-bottom:18px;
}
.chapter-eyebrow{
  font-family:var(--mono);
  font-size:0.78rem;
  color:var(--yellow-deep);
}
.chapter-head h1{
  font-family:var(--sans);
  font-size:1.65rem;
  margin:2px 0 4px 0;
}
.chapter-head .sub{color:var(--ink-soft); font-style:italic;}
.chapter-head .goal-line{
  margin:12px 0 0 0; max-width:64ch; color:var(--ink); font-size:0.95rem; line-height:1.5;
  background:var(--paper-raised); border-left:4px solid var(--yellow); padding:10px 14px; border-radius:0 4px 4px 0;
}

.subtabs{
  display:flex; gap:0; margin-bottom:20px; border-bottom:1.5px solid var(--line);
}
.subtab{
  font-family:var(--sans);
  font-size:0.85rem;
  font-weight:500;
  padding:9px 18px;
  background:none;
  border:none;
  border-bottom:3px solid transparent;
  color:var(--ink-soft);
  border-radius:0;
}
.subtab.active{color:var(--ink); border-bottom-color:var(--yellow);}

.section-title{
  font-family:var(--sans);
  font-weight:600;
  font-size:0.95rem;
  margin:26px 0 4px 0;
}
.section-note{color:var(--ink-soft); font-size:0.85rem; margin:0 0 12px 0;}

/* Vocabulary category block */
.vocab-cat{margin-bottom:26px;}
.vocab-cat-head{
  display:flex; align-items:baseline; gap:10px; margin-bottom:10px;
}
.vocab-cat-head h3{
  font-family:var(--sans); font-size:0.98rem; margin:0; font-weight:600;
}
.vocab-cat-head .count{
  font-family:var(--mono); font-size:0.75rem; color:var(--ink-soft);
}
.vocab-cat-head .scope{
  font-size:0.78rem; color:var(--ink-soft); font-style:italic;
}
.card-row{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));
  gap:10px;
}
.vcard{
  perspective:800px;
  height:82px;
}
.vcard-inner{
  position:relative; width:100%; height:100%;
  transition:transform .35s cubic-bezier(.4,.1,.2,1);
  transform-style:preserve-3d;
}
.vcard.flipped .vcard-inner{transform:rotateY(180deg);}
.vcard-face{
  position:absolute; inset:0;
  backface-visibility:hidden;
  border:1.5px solid var(--ink);
  border-radius:3px;
  background:var(--paper-raised);
  display:flex; align-items:center; justify-content:center;
  text-align:center;
  padding:6px;
  font-family:var(--mono);
  font-size:0.86rem;
  line-height:1.25;
}
.vcard-face.back{
  transform:rotateY(180deg);
  background:#F1E7C9;
  font-family:var(--serif);
  font-style:italic;
}
.vcard::before{
  content:"";
  position:absolute; left:8px; top:-1px;
  width:16px; height:6px;
  background:var(--paper);
  border:1.5px solid var(--ink); border-top:none;
  border-radius:0 0 4px 4px;
  z-index:2;
}

/* Grammar */
.gram-card{
  border:1.5px solid var(--ink);
  border-left:5px solid var(--ink);
  background:var(--paper-raised);
  border-radius:3px;
  padding:14px 16px;
  margin-bottom:12px;
}
.gram-card h4{
  font-family:var(--sans); margin:0 0 6px 0; font-size:0.95rem;
}
.gram-card p{margin:0 0 8px 0; line-height:1.55;}
.gram-card .ex{
  font-family:var(--mono); font-size:0.85rem; color:var(--ink-soft);
  border-left:2px solid var(--line); padding-left:10px; line-height:1.8;
}
.gram-table{
  border-collapse:collapse; margin:10px 0 14px 0; font-family:var(--mono); font-size:0.85rem;
}
.gram-table td{
  border:1px solid var(--line); padding:5px 12px; background:var(--paper);
}
.mono-q{font-family:var(--mono); font-size:1.05rem !important;}
.excl-box{
  border:1.5px dashed var(--red);
  border-radius:3px;
  padding:12px 16px;
  background:#F6EAE8;
  margin-top:16px;
}
.excl-box h4{
  font-family:var(--sans); color:var(--red); margin:0 0 8px 0; font-size:0.88rem;
}
.excl-box ul{margin:0; padding-left:18px; columns:2; column-gap:24px;}
.excl-box li{margin-bottom:4px; font-size:0.87rem; color:#7a2e26;}

.func-list{list-style:none; margin:0; padding:0;}
.func-list li{
  display:flex; gap:10px; padding:8px 0; border-bottom:1px solid var(--line);
  align-items:baseline;
}
.func-list .de{font-family:var(--mono); font-size:0.87rem; color:var(--ink);}
.func-list .en{color:var(--ink-soft); font-size:0.83rem;}

/* Practice */
.practice-menu{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:20px;}
.practice-menu button{
  font-size:0.85rem; padding:10px 16px; font-weight:500;
}
.practice-menu button.primary{background:var(--yellow); border-color:var(--ink);}
.quiz-box{
  border:1.5px solid var(--ink); border-radius:4px; background:var(--paper-raised);
  padding:22px; max-width:560px;
}
.quiz-progress{
  font-family:var(--mono); font-size:0.75rem; color:var(--ink-soft); margin-bottom:10px;
}
.quiz-q{font-family:var(--sans); font-size:1.1rem; font-weight:600; margin-bottom:16px;}
.quiz-opts{display:flex; flex-direction:column; gap:8px;}
.quiz-opt{
  text-align:left; padding:11px 14px; font-size:0.92rem; font-family:var(--serif);
  background:var(--paper);
}
.quiz-opt:hover{background:#fff;}
.quiz-opt.correct{background:#DDEEE4; border-color:var(--green); color:var(--green);}
.quiz-opt.wrong{background:#F6DEDA; border-color:var(--red); color:var(--red);}
.quiz-opt[disabled]{cursor:default;}
.quiz-footer{margin-top:16px; display:flex; justify-content:space-between; align-items:center;}
.quiz-result{
  text-align:center; padding:20px 0;
}
.quiz-result .big-stamp{
  width:110px; height:110px; border-radius:50%; border:3px solid var(--green);
  color:var(--green); display:flex; flex-direction:column; align-items:center; justify-content:center;
  margin:0 auto 16px auto; transform:rotate(-6deg); font-family:var(--mono);
}
.quiz-result .big-stamp span{font-size:1.7rem; font-weight:700; line-height:1;}
.checklist{margin-top:26px;}
.check-item{
  display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line);
}
.check-item input{width:17px; height:17px; accent-color:var(--green);}
.check-item label{font-size:0.9rem; cursor:pointer;}

.small-btn{font-size:0.78rem; padding:5px 10px;}

footer.appfoot{
  margin-top:40px; padding-top:16px; border-top:1px solid var(--line);
  font-size:0.75rem; color:var(--ink-soft); font-family:var(--mono);
}

@media (max-width: 820px){
  #app{flex-direction:column;}
  #sidebar{
    width:100%; height:auto; position:relative; padding:14px;
    display:flex; flex-direction:column;
  }
  .tab-list{display:flex; flex-wrap:wrap; gap:4px;}
  .tab-item{transform:none; border-radius:4px; border-right:1.5px solid var(--ink); width:auto;}
  #main{padding:20px;}
}
</style>
</head>
<body>
<div id="app">
  <nav id="sidebar">
    <div class="brand">Sprachheft <small>A1 Deutsch Trainer</small></div>
    <ul class="tab-list" id="tabList"></ul>
  </nav>
  <main id="main"></main>
</div>

<script id="data-script">
const CHAPTERS = [
{
  id:1, titleDe:"Hallo!", titleEn:"Greetings & Introductions", quota:50,
  goal:"By the end of this chapter you can greet someone, introduce yourself, and ask their name, where they're from, and how they're doing.",
  categories:[
    {name:"Greetings & politeness chunks", scope:"Core social formulas", items:[
      {de:"Hallo",en:"hi / hello"},{de:"Guten Morgen",en:"good morning"},{de:"Guten Tag",en:"good day / hello"},
      {de:"Guten Abend",en:"good evening"},{de:"Gute Nacht",en:"good night"},{de:"Tschüss",en:"bye"},
      {de:"Auf Wiedersehen",en:"goodbye (formal)"},{de:"bitte / danke",en:"please / thank you"}
    ]},
    {name:"Personal introduction lexemes", scope:"Name, origin, profession only", items:[
      {de:"der Name",en:"name"},{de:"der Vorname",en:"first name"},{de:"der Nachname",en:"last name"},
      {de:"das Land",en:"country"},{de:"die Stadt",en:"city"},{de:"die Sprache",en:"language"},
      {de:"der Beruf",en:"profession"},{de:"heißen",en:"to be called"},{de:"kommen",en:"to come"},{de:"wohnen",en:"to live"}
    ]},
    {name:"Countries & languages", scope:"High-frequency only", items:[
      {de:"Deutschland",en:"Germany"},{de:"Deutsch",en:"German"},{de:"England",en:"England"},
      {de:"Englisch",en:"English"},{de:"Frankreich",en:"France"},{de:"Französisch",en:"French"}
    ]},
    {name:"Numbers 0–20", scope:"Cardinal numbers only", items:[
      {de:"null",en:"0"},{de:"eins",en:"1"},{de:"zwei",en:"2"},{de:"drei",en:"3"},{de:"vier",en:"4"},
      {de:"fünf",en:"5"},{de:"sechs",en:"6"},{de:"sieben",en:"7"},{de:"acht",en:"8"},{de:"neun",en:"9"},
      {de:"zehn",en:"10"},{de:"elf",en:"11"},{de:"zwölf",en:"12"},{de:"dreizehn",en:"13"},{de:"vierzehn",en:"14"},
      {de:"fünfzehn",en:"15"},{de:"sechzehn",en:"16"},{de:"siebzehn",en:"17"},{de:"achtzehn",en:"18"},
      {de:"neunzehn",en:"19"},{de:"zwanzig",en:"20"}
    ]},
    {name:"Essential question/answer chunks", scope:"Fixed introductory questions", items:[
      {de:"Wie heißen Sie?",en:"what's your name? (formal)"},{de:"Woher kommen Sie?",en:"where are you from? (formal)"},
      {de:"Wie geht es Ihnen?",en:"how are you? (formal)"},{de:"Wie geht's?",en:"how's it going? (informal)"},
      {de:"Bitte buchstabieren Sie das.",en:"please spell that"}
    ]}
  ],
  functions:[
    {de:"Ich heiße …",en:"say their name"},{de:"Ich komme aus …",en:"say where they come from"},
    {de:"Ich wohne in …",en:"say where they live"},{de:"Wie heißen Sie? / Wie heißt du?",en:"ask someone's name"},
    {de:"Woher kommen Sie? / Woher kommst du?",en:"ask where someone comes from"},
    {de:"Wie geht es Ihnen? / Wie geht's?",en:"ask how someone is"},
    {de:"Bitte buchstabieren Sie das.",en:"spell a name or word"},{de:"Das ist …",en:"introduce another person"}
  ],
  grammar:[
    {title:"ich, du, sie… — talking about people", teach:"Every German sentence needs a subject — the person doing the action. These are the words for 'I', 'you', 'he/she/it' and so on. Learn them first, because you'll use them in every single sentence from now on.", table:[["ich","I"],["du","you (informal)"],["er / sie / es","he / she / it"],["wir","we"],["ihr","you all (informal)"],["sie / Sie","they / you (formal)"]], examples:["ich wohne — I live","du kommst — you come","sie heißt — her name is"]},
    {title:"sein and haben — 'to be' and 'to have'", teach:"These two verbs are irregular, which means they don't follow the normal pattern — you simply have to memorise each form. You'll use them constantly, so it's worth learning this table by heart before moving on.", table:[["ich bin / ich habe","I am / I have"],["du bist / du hast","you are / you have"],["er/sie/es ist / hat","he/she/it is / has"],["wir sind / haben","we are / we have"],["ihr seid / habt","you all are / have"],["sie/Sie sind / haben","they/you are / have"]], examples:["Ich bin müde. — I am tired.","Ich habe ein Buch. — I have a book."]},
    {title:"Regular verbs in the present tense", teach:"Most German verbs are regular. Take off the -en ending to find the stem, then add the right ending for the subject you're using: -e, -st, -t, -en, -t, -en.", table:[["ich wohn-e","du wohn-st"],["er/sie/es wohn-t","wir wohn-en"],["ihr wohn-t","sie/Sie wohn-en"]], examples:["wohnen → ich wohne, du wohnst, wir wohnen","kommen → ich komme, du kommst"]},
    {title:"Asking questions with a question word", teach:"To ask 'who, what, where, where from, how', put the question word first, then the verb, then the subject. This word order stays fixed no matter what the question word is.", table:null, examples:["Wie heißt du? — What's your name?","Woher kommst du? — Where are you from?","Wo wohnst du? — Where do you live?"]},
    {title:"Yes/no questions", teach:"If there's no question word, just swap the subject and verb around so the verb comes first. Your voice rises at the end, just like in English.", table:null, examples:["Kommst du aus Spanien? — Are you from Spain?","Wohnst du in Berlin? — Do you live in Berlin?"]},
    {title:"The nominative case", teach:"'Case' just means the job a noun is doing in the sentence. Nominative is the case for the subject — the person or thing doing the action. In this chapter every noun you use is nominative, so der/die/das always stay in this basic form.", table:null, examples:["Der Mann heißt Peter.","Die Frau kommt aus Italien.","Das Kind spielt."]},
  ],
  drills:[
    {q:"Ich ___ Anna. (heißen)", options:["heiße","heißt","heißen","heißen wir"], answer:"heiße"},
    {q:"___ du aus Deutschland?", options:["Kommst","Komme","Kommen","Kommt"], answer:"Kommst"},
    {q:"Wie ___ es Ihnen?", options:["geht","gehen","gehst","gehe"], answer:"geht"},
    {q:"Ich ___ 25 Jahre alt. (sein)", options:["bin","bist","ist","sind"], answer:"bin"},
    {q:"___ heißen Sie? (asking a name, formal)", options:["Wie","Wo","Was","Wer"], answer:"Wie"},
  ],
  comingLater:["Talking about the past","Accusative and Dative case","Describing people in detail","Formal writing"]
},
{
  id:2, titleDe:"Dinge & Menschen", titleEn:"Things & People", quota:50,
  goal:"By the end of this chapter you can name everyday objects with the right article, say what you own, and introduce your family.",
  categories:[
    {name:"Classroom objects", scope:"Basic learning objects only", items:[
      {de:"das Buch",en:"book"},{de:"das Heft",en:"notebook"},{de:"der Stift",en:"pen"},{de:"der Bleistift",en:"pencil"},
      {de:"der Kuli",en:"ballpoint pen"},{de:"das Papier",en:"paper"},{de:"die Tasche",en:"bag"},{de:"der Tisch",en:"table"},
      {de:"der Stuhl",en:"chair"},{de:"die Tafel",en:"board"},{de:"das Lineal",en:"ruler"},{de:"der Radiergummi",en:"eraser"}
    ]},
    {name:"Everyday household objects", scope:"Simple objects, not appliances/tools", items:[
      {de:"die Lampe",en:"lamp"},{de:"der Schlüssel",en:"key"},{de:"das Handy",en:"phone"},{de:"die Uhr",en:"clock/watch"},
      {de:"der Spiegel",en:"mirror"},{de:"die Tasse",en:"cup"},{de:"der Teller",en:"plate"},{de:"das Messer",en:"knife"},
      {de:"die Gabel",en:"fork"},{de:"der Löffel",en:"spoon"},{de:"das Kissen",en:"pillow"},{de:"die Decke",en:"blanket"}
    ]},
    {name:"Colours", scope:"Basic colours only", items:[
      {de:"rot",en:"red"},{de:"blau",en:"blue"},{de:"grün",en:"green"},{de:"gelb",en:"yellow"},
      {de:"schwarz",en:"black"},{de:"weiß",en:"white"},{de:"braun",en:"brown"},{de:"orange",en:"orange"}
    ]},
    {name:"Immediate family", scope:"No extended family", items:[
      {de:"die Mutter",en:"mother"},{de:"der Vater",en:"father"},{de:"die Eltern",en:"parents"},
      {de:"die Schwester",en:"sister"},{de:"der Bruder",en:"brother"},{de:"das Kind",en:"child"},
      {de:"der Mann",en:"man/husband"},{de:"die Frau",en:"woman/wife"},{de:"der Freund",en:"friend (m)"},{de:"die Freundin",en:"friend (f)"}

    {title:"ein, eine — 'a/an'", teach:"Just like English 'a/an', but ein/eine still change with gender: ein for masculine and neuter, eine for feminine. There's no plural form of 'a/an' in German, just like in English.", table:null, examples:["ein Stift — a pen","eine Tasche — a bag","ein Buch — a book"]},

    {title:"am, um, im — time prepositions", teach:"Each time preposition has its own job: am for days, um for clock times, im for months and seasons. Mixing these up is one of the most common beginner mistakes, so it's worth drilling them separately.", table:[["am Montag","on Monday"],["um neun Uhr","at nine o'clock"],["im Winter","in winter"]], examples:["Am Montag arbeite ich.","Ich stehe um sieben Uhr auf.","Im Winter ist es kalt."]},

      {de:"Leider kann ich nicht kommen.",en:"unfortunately I can't come"},{de:"Ich wünsche dir alles Gute.",en:"I wish you all the best"},
      {de:"Wir feiern Weihnachten.",en:"we celebrate Christmas"},{de:"Frohe Weihnachten!",en:"merry Christmas!"},
      {de:"Frohes neues Jahr!",en:"happy new year!"},{de:"Alles Gute zum Geburtstag!",en:"happy birthday!"},
      {de:"Ich hätte gern …",en:"I would like …"},{de:"Könnten Sie bitte …?",en:"could you please …?"}
    ]}
  ],
  functions:[
    {de:"Ich lade dich zu meiner Party ein.",en:"invite someone"},{de:"Kommst du?",en:"ask if someone can come"},
    {de:"Herzlichen Glückwunsch!",en:"congratulate someone"},{de:"Danke für die Einladung.",en:"thank for an invitation"},
    {de:"Leider kann ich nicht kommen.",en:"decline politely"},{de:"Ich wünsche dir alles Gute.",en:"give good wishes"},
    {de:"Wir feiern Weihnachten.",en:"mention a festival"}
  ],
  grammar:[
    {title:"Separable verbs again: einladen", teach:"Just like aufstehen in Chapter 3, einladen splits — ein- jumps to the end of the sentence.", table:null, examples:["Ich lade dich zu meiner Party ein.","Wir laden euch ein."]},
    {title:"Four fixed polite chunks", teach:"German has a full conditional mood (Konjunktiv II) for politeness, but at A1 you only need four ready-made forms — learn them as fixed phrases rather than a grammar rule.", table:[["Ich hätte gern…","I would like…"],["Ich wäre…","I would be…"],["Ich könnte…","I could…"],["Ich würde…","I would…"]], examples:["Ich hätte gern ein Stück Kuchen.","Könnten Sie bitte kommen?"]},
    {title:"werden for the future (just recognise it)", teach:"You'll sometimes see werden + infinitive used to talk about the future. At A1 you only need to recognise it when you hear or read it — you don't have to produce it yourself yet.", table:null, examples:["Wir werden feiern. — We will celebrate."]},
  ],
  drills:[
    {q:"Ich lade dich zu meiner Party ___. (einladen)", options:["ein","an","auf","aus"], answer:"ein"},
    {q:"Ich ___ gern ein Stück Kuchen. (hätte — I'd like)", options:["hätte","habe","hatte","haben"], answer:"hätte"},
    {q:"___ Sie bitte kommen? (could)", options:["Könnten","Können","Konnten","Kann"], answer:"Könnten"},
    {q:"Herzlichen ___! (congratulations)", options:["Glückwunsch","Glück","Wunsch","Feier"], answer:"Glückwunsch"},
    {q:"Wir ___ Weihnachten. (feiern)", options:["feiern","feiert","feierst","gefeiert"], answer:"feiern"},
  ],
  comingLater:["The full Konjunktiv II system","Regional festival traditions","Formal wedding invitations"]
},
];

const PASSIVE_VOCAB = [
  {de:"weniger bekannte Speisen",en:"less common menu foods",note:"you'll see these on menus, but don't need to produce them"},
  {de:"die Baumwolle",en:"cotton",note:"fabric name, recognise it while reading"},
  {de:"die Seide",en:"silk",note:"fabric name, recognise it while reading"},
  {de:"das Polyester",en:"polyester",note:"fabric name, recognise it while reading"},
  {de:"regionale Grüße",en:"regional greetings",note:"e.g. Grüezi, Servus — good to recognise, no need to use them yet"},
  {de:"Flughafenschilder",en:"airport signs",note:"e.g. Ankunft, Abflug, Gepäck — reading recognition only"},
  {de:"weniger übliche Hobbys",en:"less common hobbies",note:"e.g. Angeln, Reiten — just for exposure"},
  {de:"innere Körperteile",en:"internal body parts",note:"only if they appear in a simplified doctor text"},
  {de:"detaillierte Wettervorhersage",en:"detailed weather-forecast vocabulary",note:"for listening/reading exposure only"}
];
</script>
<script id="app-script">
/* ---------------- State ---------------- */
const state = {
  view: "home",
  subtab: "vocab",
  progress: {},
  quiz: null,        // vocab quiz session
  drillQuiz: null     // grammar drill quiz session
};
CHAPTERS.forEach(c => { state.progress[c.id] = { quizPct: null, drillPct: null, checklist: {} }; });

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function pick(arr,n){ return shuffle(arr).slice(0,n); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ---------------- Sidebar ---------------- */
function renderSidebar(){
  const list = document.getElementById("tabList");
  let html = `<li><button class="tab-item home ${state.view==='home'?'active':''}" onclick="goHome()"><span class="num">⌂</span>Übersicht</button></li>`;
  CHAPTERS.forEach(c=>{
    html += `<li><button class="tab-item ${state.view===c.id?'active':''}" onclick="goChapter(${c.id})">
      <span class="num">${String(c.id).padStart(2,'0')}</span>${esc(c.titleDe)}
    </button></li>`;
  });
  list.innerHTML = html;
}

/* ---------------- Navigation ---------------- */
function goHome(){ state.view="home"; render(); }
function goChapter(id){ state.view=id; state.subtab="vocab"; state.quiz=null; state.drillQuiz=null; render(); window.scrollTo(0,0); }
function setSubtab(t){ state.subtab=t; state.quiz=null; state.drillQuiz=null; render(); }

/* ---------------- Progress helpers ---------------- */
function chapterProgressPct(c){
  const p = state.progress[c.id];
  const checklistTotal = c.functions.length;
  const checklistDone = Object.values(p.checklist).filter(Boolean).length;
  const checklistPct = checklistTotal ? (checklistDone/checklistTotal) : 0;
  const quizPct = p.quizPct===null ? 0 : p.quizPct/100;
  const drillPct = p.drillPct===null ? 0 : p.drillPct/100;
  return Math.round(((checklistPct*0.34)+(quizPct*0.33)+(drillPct*0.33))*100);
}

/* ---------------- Home ---------------- */
function renderHome(){
  const totalItems = CHAPTERS.reduce((s,c)=>s+c.categories.reduce((a,cat)=>a+cat.items.length,0),0);
  const avgProgress = Math.round(CHAPTERS.reduce((s,c)=>s+chapterProgressPct(c),0)/CHAPTERS.length);
  let cards = CHAPTERS.map(c=>{
    const pct = chapterProgressPct(c);
    const stampClass = pct>=80?'done':(pct>0?'mid':'');
    return `<button class="chapter-card" onclick="goChapter(${c.id})">
      <span class="cnum">Kapitel ${String(c.id).padStart(2,'0')}</span>
      <span class="ctitle-de">${esc(c.titleDe)}</span>
      <span class="ctitle-en">${esc(c.titleEn)}</span>
      <span class="cfoot">
        <span class="quota-pill">${c.quota} Wörter</span>
        <span class="stamp ${stampClass}">${pct}%</span>
      </span>
    </button>`;
  }).join("");
  document.getElementById("main").innerHTML = `
    <div class="home-header">
      <h1>Willkommen bei Sprachheft</h1>
      <p>Your German A1 course: 12 chapters that build on each other. In every chapter you'll learn new words, get a short grammar lesson with practice, and check off what you can already say.</p>
      <div class="home-stats">
        <div class="stat"><span class="n">${totalItems}</span><span class="l">words to learn</span></div>
        <div class="stat"><span class="n">12</span><span class="l">chapters</span></div>
        <div class="stat"><span class="n">${avgProgress}%</span><span class="l">your progress</span></div>
      </div>
    </div>
    <div class="section-title">Words you'll meet but don't need to produce</div>
    <p class="section-note">These show up in listening or reading, just so nothing feels totally unfamiliar — you're never tested on them.</p>
    <div class="excl-box" style="border-color:var(--ink-soft); background:var(--paper-raised); border-style:solid;">
      <ul style="columns:2;">
        ${PASSIVE_VOCAB.map(p=>`<li style="color:var(--ink-soft);"><strong style="font-family:var(--mono); color:var(--ink);">${esc(p.de)}</strong> — ${esc(p.en)}</li>`).join("")}
      </ul>
    </div>
    <div class="section-title">Chapters</div>
    <div class="chapter-grid">${cards}</div>
    <footer class="appfoot">Sprachheft · A1 Deutsch Trainer · your progress is saved for this session</footer>
  `;
}

/* ---------------- Chapter shell ---------------- */
function renderChapter(){
  const c = CHAPTERS.find(x=>x.id===state.view);
  const main = document.getElementById("main");
  main.innerHTML = `
    <div class="chapter-head">
      <div class="chapter-eyebrow">Kapitel ${String(c.id).padStart(2,'0')} · ${c.quota} Wörter</div>
      <h1>${esc(c.titleDe)}</h1>
      <div class="sub">${esc(c.titleEn)}</div>
      <p class="goal-line">${esc(c.goal)}</p>
    </div>
    <div class="subtabs">
      <button class="subtab ${state.subtab==='vocab'?'active':''}" onclick="setSubtab('vocab')">Wortschatz</button>
      <button class="subtab ${state.subtab==='grammar'?'active':''}" onclick="setSubtab('grammar')">Grammatik</button>
      <button class="subtab ${state.subtab==='practice'?'active':''}" onclick="setSubtab('practice')">Übung</button>
    </div>
    <div id="subtabContent"></div>
  `;
  const target = document.getElementById("subtabContent");
  if(state.subtab==="vocab") target.innerHTML = vocabHTML(c);
  else if(state.subtab==="grammar") target.innerHTML = grammarHTML(c);
  else target.innerHTML = practiceHTML(c);
  if(state.subtab==="practice") wirePractice(c);
  if(state.subtab==="grammar") wireGrammarDrill(c);
}

/* ---------------- Vocabulary tab ---------------- */
function vocabHTML(c){
  return c.categories.map((cat)=>`
    <div class="vocab-cat">
      <div class="vocab-cat-head">
        <h3>${esc(cat.name)}</h3>
        <span class="count">${cat.items.length} Wörter</span>
      </div>
      <div class="card-row">
        ${cat.items.map((it)=>`
          <div class="vcard" onclick="this.classList.toggle('flipped')">
            <div class="vcard-inner">
              <div class="vcard-face front">${esc(it.de)}</div>
              <div class="vcard-face back">${esc(it.en)}</div>
            </div>
          </div>
        `).join("")}
      </div>
    </div>
  `).join("");
}

/* ---------------- Grammar tab: real lessons ---------------- */
function grammarHTML(c){
  return `
    <div class="section-title">What's new in this chapter</div>
    <p class="section-note">Read each short lesson, look at the examples, then try the practice quiz at the bottom of this page.</p>
    ${c.grammar.map(g=>`
      <div class="gram-card">
        <h4>${esc(g.title)}</h4>
        <p>${esc(g.teach)}</p>
        ${g.table ? `<table class="gram-table"><tbody>
          ${g.table.map(row=>`<tr><td>${esc(row[0])}</td><td>${esc(row[1])}</td></tr>`).join("")}
        </tbody></table>` : ""}
        ${g.examples.length ? `<div class="ex">${g.examples.map(e=>esc(e)).join("<br>")}</div>` : ""}
      </div>
    `).join("")}
    <div class="section-title">Grammatik-Check</div>
    <p class="section-note">A short quiz on exactly what you just read — nothing from later chapters.</p>
    <div class="practice-menu">
      <button class="primary" id="startDrillBtn">Grammatik-Check starten (${c.drills.length} Fragen)</button>
    </div>
    <div id="drillArea"></div>
    <div class="excl-box" style="margin-top:28px;">
      <h4>Coming in a later chapter</h4>
      <ul>${c.comingLater.map(e=>`<li>${esc(e)}</li>`).join("")}</ul>
    </div>
  `;
}

function wireGrammarDrill(c){
  const btn = document.getElementById("startDrillBtn");
  if(btn) btn.onclick = ()=>{ state.drillQuiz = buildDrillQuiz(c); renderDrillQuiz(c); };
  if(state.drillQuiz) renderDrillQuiz(c);
}
function buildDrillQuiz(c){
  const questions = shuffle(c.drills).map(d=>({
    prompt: d.q, correct: d.answer, options: shuffle(d.options)
  }));
  return { questions, index:0, score:0, answered:false };
}
function renderDrillQuiz(c){
  const area = document.getElementById("drillArea");
  if(!area) return;
  const q = state.drillQuiz;
  if(q.index >= q.questions.length){
    const pct = Math.round((q.score/q.questions.length)*100);
    state.progress[c.id].drillPct = pct;
    area.innerHTML = `
      <div class="quiz-box quiz-result">
        <div class="big-stamp"><span>${pct}%</span>GRAMMATIK</div>
        <p>${q.score} von ${q.questions.length} richtig.</p>
        <button onclick="state.drillQuiz=buildDrillQuiz(CHAPTERS.find(x=>x.id===${c.id})); renderDrillQuiz(CHAPTERS.find(x=>x.id===${c.id}))">Nochmal üben</button>
      </div>`;
    return;
  }
  const cur = q.questions[q.index];
  area.innerHTML = `
    <div class="quiz-box">
      <div class="quiz-progress">Frage ${q.index+1} / ${q.questions.length} · Punkte: ${q.score}</div>
      <div class="quiz-q mono-q">${esc(cur.prompt)}</div>
      <div class="quiz-opts">
        ${cur.options.map(opt=>`<button class="quiz-opt" data-opt="${esc(opt)}" onclick="answerDrill(${c.id}, this)">${esc(opt)}</button>`).join("")}
      </div>
      <div class="quiz-footer">
        <span class="quiz-progress" id="drillFeedback"></span>
        <button class="small-btn" id="drillNextBtn" style="display:none" onclick="nextDrillQuestion(${c.id})">Weiter →</button>
      </div>
    </div>`;
}
function answerDrill(cid, btnEl){
  const q = state.drillQuiz;
  if(q.answered) return;
  q.answered = true;
  const chosen = btnEl.getAttribute("data-opt");
  const cur = q.questions[q.index];
  document.querySelectorAll("#drillArea .quiz-opt").forEach(o=>{
    o.setAttribute("disabled","true");
    if(o.getAttribute("data-opt")===cur.correct) o.classList.add("correct");
    else if(o===btnEl) o.classList.add("wrong");
  });
  if(chosen===cur.correct){ q.score++; document.getElementById("drillFeedback").textContent="Richtig!"; }
  else { document.getElementById("drillFeedback").textContent="Nicht ganz — richtig markiert."; }
  document.getElementById("drillNextBtn").style.display="inline-block";
}
function nextDrillQuestion(cid){
  const c = CHAPTERS.find(x=>x.id===cid);
  state.drillQuiz.index++;
  state.drillQuiz.answered = false;
  renderDrillQuiz(c);
}

/* ---------------- Practice tab (vocab quiz + can-do checklist) ---------------- */
function practiceHTML(c){
  return `
    <div class="section-title">Wortschatz-Quiz</div>
    <p class="section-note">Multiple choice on this chapter's vocabulary.</p>
    <div class="practice-menu">
      <button class="primary" id="startQuizBtn">Quiz starten (${Math.round(c.categories.reduce((s,ca)=>s+ca.items.length,0)*0.6)} Fragen)</button>
    </div>
    <div id="quizArea"></div>
    <div class="checklist">
      <div class="section-title">Was du jetzt sagen kannst</div>
      <p class="section-note">Tick these off as you get comfortable saying them.</p>
      ${c.functions.map((f,i)=>{
        const checked = !!state.progress[c.id].checklist[i];
        return `<div class="check-item">
          <input type="checkbox" id="chk-${c.id}-${i}" ${checked?'checked':''} onchange="toggleCheck(${c.id},${i},this.checked)">
          <label for="chk-${c.id}-${i}"><span style="font-family:var(--mono); font-size:0.88rem;">${esc(f.de)}</span> — ${esc(f.en)}</label>
        </div>`;
      }).join("")}
    </div>
  `;
}
function toggleCheck(cid,i,val){
  state.progress[cid].checklist[i]=val;
}

/* ---------------- Vocab quiz engine ---------------- */
function buildQuiz(c){
  const allItems = c.categories.flatMap(cat=>cat.items);
  const qCount = Math.max(6, Math.round(allItems.length*0.6));
  const chosen = pick(allItems, Math.min(qCount, allItems.length));
  const questions = chosen.map(it=>{
    const wrongPool = allItems.filter(x=>x.en!==it.en);
    const wrongs = pick(wrongPool,3).map(x=>x.en);
    const options = shuffle([it.en, ...wrongs]);
    return { prompt: it.de, correct: it.en, options };
  });
  return { questions, index:0, score:0, answered:false };
}
function wirePractice(c){
  const btn = document.getElementById("startQuizBtn");
  if(btn) btn.onclick = ()=>{ state.quiz = buildQuiz(c); renderQuiz(c); };
  if(state.quiz) renderQuiz(c);
}
function renderQuiz(c){
  const area = document.getElementById("quizArea");
  const q = state.quiz;
  if(q.index >= q.questions.length){
    const pct = Math.round((q.score/q.questions.length)*100);
    state.progress[c.id].quizPct = pct;
    area.innerHTML = `
      <div class="quiz-box quiz-result">
        <div class="big-stamp"><span>${pct}%</span>KAPITEL ${String(c.id).padStart(2,'0')}</div>
        <p>${q.score} von ${q.questions.length} richtig.</p>
        <button onclick="state.quiz=buildQuiz(CHAPTERS.find(x=>x.id===${c.id})); renderQuiz(CHAPTERS.find(x=>x.id===${c.id}))">Nochmal üben</button>
      </div>
    `;
    return;
  }
  const cur = q.questions[q.index];
  area.innerHTML = `
    <div class="quiz-box">
      <div class="quiz-progress">Frage ${q.index+1} / ${q.questions.length} · Punkte: ${q.score}</div>
      <div class="quiz-q">${esc(cur.prompt)}</div>
      <div class="quiz-opts">
        ${cur.options.map(opt=>`<button class="quiz-opt" data-opt="${esc(opt)}" onclick="answerQuiz(${c.id}, this)">${esc(opt)}</button>`).join("")}
      </div>
      <div class="quiz-footer">
        <span class="quiz-progress" id="quizFeedback"></span>
        <button class="small-btn" id="nextBtn" style="display:none" onclick="nextQuizQuestion(${c.id})">Weiter →</button>
      </div>
    </div>
  `;
}
function answerQuiz(cid, btnEl){
  const q = state.quiz;
  if(q.answered) return;
  q.answered = true;
  const chosen = btnEl.getAttribute("data-opt");
  const cur = q.questions[q.index];
  document.querySelectorAll("#quizArea .quiz-opt").forEach(o=>{
    o.setAttribute("disabled","true");
    if(o.getAttribute("data-opt")===cur.correct) o.classList.add("correct");
    else if(o===btnEl) o.classList.add("wrong");
  });
  if(chosen===cur.correct){ q.score++; document.getElementById("quizFeedback").textContent="Richtig!"; }
  else { document.getElementById("quizFeedback").textContent="Nicht ganz — richtig markiert."; }
  document.getElementById("nextBtn").style.display="inline-block";
}
function nextQuizQuestion(cid){
  const c = CHAPTERS.find(x=>x.id===cid);
  state.quiz.index++;
  state.quiz.answered = false;
  renderQuiz(c);
}

/* ---------------- Render root ---------------- */
function render(){
  renderSidebar();
  if(state.view==="home") renderHome();
  else renderChapter();
}
render();

/* ---------------- PWA: register service worker ---------------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* offline install optional, fails gracefully on file:// */ });
  });
}

</script>
</body>
