<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sprachheft — Deutsch Trainer</title>
<meta name="theme-color" content="#101A2E">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sprachheft">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ================= DESIGN TOKENS ================= */
:root{
  --bg:#F6F3EC; --bg2:#EFEAE0;
  --card:#FFFFFF; --card2:#FBF9F4;
  --ink:#151E31; --ink2:#3D4A63; --soft:#7A8095;
  --line:#E5DFD2; --line2:#D6CFBE;

  --rail:#101A2E; --rail2:#182338; --rail-tx:#EDF1F8; --rail-mut:rgba(237,241,248,.55);

  --lv:#F59E0B;                    /* live level accent (set by JS) */
  --ok:#12A98C; --okbg:#E3F6F1;
  --bad:#E5484D; --badbg:#FDEBEC;

  --sh1:0 1px 2px rgba(21,30,49,.06),0 1px 3px rgba(21,30,49,.05);
  --sh2:0 10px 24px -8px rgba(21,30,49,.16),0 3px 8px -2px rgba(21,30,49,.08);
  --sh3:0 28px 56px -18px rgba(21,30,49,.30),0 10px 20px -10px rgba(21,30,49,.14);
  --glow:0 0 0 4px color-mix(in srgb,var(--lv) 20%,transparent);

  --r1:8px; --r2:14px; --r3:20px; --pill:999px;
  --ease:cubic-bezier(.22,1,.36,1);
  --sans:'Space Grotesk',system-ui,sans-serif;
  --serif:'Source Serif 4',Georgia,serif;
  --mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--serif); color:var(--ink); line-height:1.6; min-height:100vh;
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1100px 600px at 108% -10%, color-mix(in srgb,var(--lv) 12%,transparent), transparent 55%),
    radial-gradient(900px 520px at -10% 8%, color-mix(in srgb,#3D6BFF 9%,transparent), transparent 55%),
    var(--bg);
  background-attachment:fixed;
}
body::before{ /* dot grid */
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.55;
  background-image:radial-gradient(circle,var(--line2) .9px,transparent .9px);
  background-size:22px 22px;
  -webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 25%,#000 30%,transparent 100%);
          mask-image:radial-gradient(ellipse 90% 70% at 50% 25%,#000 30%,transparent 100%);
}
::selection{background:var(--lv);color:#10141c}
button{font-family:var(--sans);cursor:pointer;border:0;background:none;color:inherit;
  transition:transform .16s var(--ease),box-shadow .22s var(--ease),background .22s var(--ease),color .22s var(--ease),border-color .22s var(--ease);}
button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:none;box-shadow:0 0 0 3px var(--card),0 0 0 6px var(--lv);border-radius:var(--r1)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--soft)}

/* ================= SHELL ================= */
#app{display:flex;min-height:100vh;max-width:1440px;margin:0 auto;position:relative;z-index:1}
#main{flex:1;min-width:0;padding:34px 44px 110px}

/* ================= DARK RAIL ================= */
#rail{width:264px;flex-shrink:0;position:sticky;top:0;align-self:flex-start;height:100vh;
  overflow-y:auto;padding:26px 18px 26px 22px;color:var(--rail-tx);
  background:linear-gradient(168deg,var(--rail),var(--rail2) 55%,var(--rail));
  box-shadow:10px 0 44px -20px rgba(16,26,46,.6);z-index:5;}
#rail::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-color:var(--rail)}
.brand{font-family:var(--sans);font-weight:700;font-size:1.15rem;letter-spacing:-.01em;
  display:flex;align-items:center;gap:11px;padding-bottom:20px;margin-bottom:16px;
  border-bottom:1px solid rgba(255,255,255,.12)}
.brand .logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;
  font-size:1.2rem;background:linear-gradient(135deg,var(--lv),color-mix(in srgb,var(--lv) 55%,#fff));
  box-shadow:0 6px 16px -4px color-mix(in srgb,var(--lv) 60%,transparent)}
.brand small{display:block;font-family:var(--serif);font-style:italic;font-weight:400;font-size:.76rem;color:var(--rail-mut)}
.tab-list{list-style:none;margin:0;padding:0}
.tab-item{position:relative;display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:10px 12px;margin-bottom:5px;border-radius:11px;font-size:.86rem;font-weight:500;
  color:var(--rail-mut)}
.tab-item .num{font-family:var(--mono);font-size:.72rem;min-width:1.7em;text-align:center;
  padding:3px 0;border-radius:6px;background:rgba(255,255,255,.08);color:var(--rail-mut)}
.tab-item::before{content:"";position:absolute;left:-22px;top:50%;transform:translateY(-50%) scaleY(0);
  width:4px;height:24px;border-radius:0 4px 4px 0;background:var(--lv);transition:transform .25s var(--ease)}
.tab-item:hover{background:rgba(255,255,255,.06);color:#fff;transform:translateX(2px)}
.tab-item.active{background:linear-gradient(90deg,color-mix(in srgb,var(--lv) 22%,transparent),color-mix(in srgb,var(--lv) 4%,transparent));color:#fff}
.tab-item.active::before{transform:translateY(-50%) scaleY(1)}
.tab-item.active .num{background:var(--lv);color:#10141c;font-weight:700}
.tab-item.home{margin-bottom:14px;font-weight:600}
.tab-item.back{color:var(--lv)}

/* ================= SHARED ================= */
.section-title{font-family:var(--sans);font-weight:600;font-size:1.02rem;margin:34px 0 4px;display:flex;align-items:center;gap:11px}
.section-title::before{content:"";width:5px;height:22px;border-radius:3px;background:var(--lv)}
.section-note{color:var(--soft);font-size:.9rem;margin:0 0 18px}
.reveal{animation:rise .55s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.foot{margin-top:56px;padding-top:18px;border-top:1px solid var(--line);text-align:center;
  font-family:var(--mono);font-size:.75rem;color:var(--soft)}

/* ================= CEFR PICKER ================= */
.cefr-hero{padding:18px 0 8px}
.cefr-hero .kicker{font-family:var(--mono);font-size:.8rem;color:var(--soft);letter-spacing:.12em;text-transform:uppercase}
.cefr-hero h1{font-family:var(--sans);font-size:clamp(2rem,4.5vw,3.1rem);font-weight:700;letter-spacing:-.03em;line-height:1.05;margin:10px 0 14px}
.cefr-hero h1 em{font-style:normal;background:linear-gradient(120deg,#F59E0B,#F4634E 55%,#8B5CF6);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.cefr-hero p{color:var(--ink2);max-width:56ch;font-size:1.02rem;margin:0}
.cefr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:20px;margin-top:34px}
.cefr-card{position:relative;overflow:hidden;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r3);padding:24px 22px 20px;min-height:210px;
  display:flex;flex-direction:column;gap:11px;box-shadow:var(--sh1)}
.cefr-card .wm{position:absolute;right:-10px;bottom:-38px;font-family:var(--sans);font-weight:700;
  font-size:7.5rem;line-height:1;color:var(--lv);opacity:.09;pointer-events:none;letter-spacing:-.04em}
.cefr-card::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,var(--lv),color-mix(in srgb,var(--lv) 30%,#fff))}
.cefr-card:not(.disabled):hover{transform:translateY(-7px);box-shadow:var(--sh3),var(--glow);border-color:color-mix(in srgb,var(--lv) 55%,var(--line))}
.cefr-card.disabled{opacity:.55;cursor:default}
.cefr-letter{font-family:var(--mono);font-weight:700;font-size:1.9rem;color:var(--lv);line-height:1}
.cefr-title{font-family:var(--sans);font-weight:600;font-size:1.15rem}
.cefr-blurb{color:var(--soft);font-size:.88rem;line-height:1.5}
.cefr-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:14px;border-top:1px dashed var(--line)}
.cefr-words{font-family:var(--mono);font-size:.73rem;color:var(--soft)}
.badge{font-family:var(--sans);font-size:.76rem;font-weight:600;padding:6px 15px;border-radius:var(--pill)}
.badge.go{background:var(--lv);color:#10141c}
.cefr-card:not(.disabled):hover .badge.go{background:#10141c;color:#fff}
.badge.soon{border:1.5px solid var(--line2);color:var(--soft)}

/* ================= LEVEL HERO ================= */
.lhero{position:relative;overflow:hidden;border-radius:var(--r3);padding:34px 36px 30px;color:#fff;
  background:linear-gradient(128deg,var(--rail) 20%,color-mix(in srgb,var(--lv) 34%,var(--rail)));
  box-shadow:var(--sh3)}
.lhero::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(600px 300px at 90% -20%,color-mix(in srgb,var(--lv) 55%,transparent),transparent 60%)}
.lhero .wm{position:absolute;right:8px;top:-30px;font-family:var(--sans);font-weight:700;font-size:9rem;line-height:1;color:rgba(255,255,255,.07);letter-spacing:-.04em}
.lhero .kicker{font-family:var(--mono);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:color-mix(in srgb,var(--lv) 80%,#fff)}
.lhero h1{font-family:var(--sans);font-size:clamp(1.7rem,3.5vw,2.5rem);font-weight:700;letter-spacing:-.02em;margin:8px 0 8px}
.lhero p{margin:0;max-width:60ch;color:rgba(255,255,255,.82);font-size:.98rem}
.lhero .stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.stat-pill{background:rgba(255,255,255,.10);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.16);
  border-radius:var(--r2);padding:12px 18px;min-width:118px}
.stat-pill b{display:block;font-family:var(--mono);font-size:1.5rem;font-weight:700;line-height:1.1}
.stat-pill span{font-size:.74rem;color:rgba(255,255,255,.7)}

/* ================= CHAPTER GRID + RING ================= */
.chapter-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;margin-top:22px}
.chapter-card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);
  padding:18px 18px 16px;text-align:left;display:flex;flex-direction:column;gap:9px;min-height:172px;box-shadow:var(--sh1)}
.chapter-card::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:4px;border-radius:0 4px 4px 0;background:var(--lv);
  opacity:0;transition:opacity .25s var(--ease)}
.chapter-card:hover{transform:translateY(-5px);box-shadow:var(--sh2),var(--glow);border-color:color-mix(in srgb,var(--lv) 45%,var(--line))}
.chapter-card:hover::before{opacity:1}
.chapter-card .cnum{font-family:var(--mono);font-size:.72rem;color:var(--lv);font-weight:600}
.chapter-card .ctitle-de{font-family:var(--sans);font-weight:600;font-size:1.06rem;line-height:1.3}
.chapter-card .ctitle-en{font-size:.84rem;color:var(--soft);font-style:italic}
.chapter-card .cfoot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:12px}
.quota-pill{font-family:var(--mono);font-size:.72rem;color:var(--ink2);background:var(--bg2);padding:5px 11px;border-radius:var(--pill)}
.ring{position:relative;width:52px;height:52px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
  background:conic-gradient(var(--lv) calc(var(--p)*1%),var(--line) 0)}
.ring::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--card)}
.ring span{position:relative;z-index:1;font-family:var(--mono);font-size:.66rem;font-weight:700}
.ring.done{background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--line) 0)}
.ring.done::before{background:var(--okbg)}
.ring.done span{color:var(--ok)}

/* ================= CHAPTER VIEW ================= */
.chead{border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:22px}
.chead .eyebrow{font-family:var(--mono);font-size:.78rem;color:var(--lv);font-weight:600;letter-spacing:.08em}
.chead h1{font-family:var(--sans);font-size:clamp(1.5rem,3vw,2.1rem);font-weight:700;letter-spacing:-.02em;margin:6px 0 4px}
.chead .sub{color:var(--soft);font-style:italic}
.goal{margin-top:18px;max-width:68ch;background:var(--card);border-left:4px solid var(--lv);
  border-radius:0 var(--r2) var(--r2) 0;padding:16px 20px;box-shadow:var(--sh1);font-size:.97rem}
.subtabs{display:inline-flex;gap:4px;background:var(--bg2);padding:6px;border-radius:var(--pill);margin-bottom:26px;border:1px solid var(--line)}
.subtab{font-family:var(--sans);font-size:.9rem;font-weight:500;padding:9px 24px;border-radius:var(--pill);color:var(--soft)}
.subtab:hover{color:var(--ink)}
.subtab.active{background:var(--ink);color:#fff;box-shadow:var(--sh1)}

/* ================= VOCAB ================= */
.vocab-cat{margin-bottom:34px}
.vocab-cat-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.vocab-cat-head h3{font-family:var(--sans);font-size:1.02rem;margin:0;font-weight:600;display:flex;align-items:center;gap:9px}
.vocab-cat-head h3::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--lv)}
.vocab-cat-head .count{font-family:var(--mono);font-size:.74rem;color:var(--soft);background:var(--bg2);padding:3px 10px;border-radius:var(--pill)}
.card-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:13px}
.vcard{perspective:1000px;height:92px;animation:rise .5s var(--ease) both;animation-delay:calc(var(--i)*30ms)}
.vcard-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s var(--ease)}
.vcard.flipped .vcard-inner{transform:rotateY(180deg)}
.vface{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r2);display:flex;align-items:center;justify-content:center;
  text-align:center;padding:10px 12px;font-family:var(--mono);font-size:.88rem;line-height:1.3;box-shadow:var(--sh1);border:1px solid var(--line)}
.vface.front{background:var(--card)}
.vface.front::after{content:"⇄";position:absolute;right:9px;bottom:6px;font-size:.7rem;color:var(--lv);opacity:.7}
.vface.front::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--lv)}
.vface.back{transform:rotateY(180deg);background:var(--ink);color:#fff;font-family:var(--serif);font-style:italic;border-color:var(--ink)}
.vcard:hover .vface.front{box-shadow:var(--sh2)}

/* ================= GRAMMAR ================= */
.gram-card{position:relative;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--lv);
  border-radius:var(--r2);padding:22px 24px 20px;margin-bottom:18px;box-shadow:var(--sh1)}
.gram-card:hover{box-shadow:var(--sh2)}
.gram-card .gnum{position:absolute;top:18px;right:20px;font-family:var(--sans);font-weight:700;font-size:2rem;
  color:var(--lv);opacity:.16;line-height:1}
.gram-card h4{font-family:var(--sans);margin:0 0 8px;font-size:1.04rem}
.gram-card p{margin:0 0 14px;line-height:1.6;font-size:.95rem}
.gram-card .ex{font-family:var(--mono);font-size:.85rem;color:var(--ink2);background:var(--bg2);
  border-left:3px solid var(--lv);padding:12px 16px;border-radius:0 var(--r1) var(--r1) 0;line-height:1.9}
.gram-table{border-collapse:collapse;margin:4px 0 16px;font-family:var(--mono);font-size:.85rem;width:100%;overflow:hidden;border-radius:var(--r1)}
.gram-table td{border:1px solid var(--line);padding:10px 15px;background:var(--card2)}
.gram-table tr:nth-child(even) td{background:var(--bg2)}
.excl-box{border:1.5px dashed color-mix(in srgb,var(--bad) 60%,var(--line2));background:var(--badbg);
  border-radius:var(--r2);padding:20px 24px;margin-top:30px}
.excl-box h4{font-family:var(--sans);color:var(--bad);margin:0 0 12px;font-size:.94rem}
.excl-box ul{margin:0;padding-left:20px;columns:2;column-gap:32px}
.excl-box li{margin-bottom:7px;font-size:.9rem;color:#8a3538}
.passive-box{border:1.5px solid var(--line2);background:var(--card);border-radius:var(--r2);padding:20px 24px;margin-top:14px}
.passive-box ul{margin:0;padding-left:20px;columns:2;column-gap:32px}
.passive-box li{margin-bottom:7px;font-size:.88rem;color:var(--soft)}
.passive-box li strong{color:var(--ink);font-family:var(--mono);font-weight:600}

/* ================= PRACTICE / QUIZ ================= */
.practice-menu{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.btn-primary{background:var(--lv);color:#10141c;font-weight:600;font-size:.92rem;padding:13px 26px;border-radius:var(--pill);box-shadow:var(--sh1)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:var(--sh2),var(--glow)}
.quiz-box{background:var(--card);border:1px solid var(--line);border-radius:var(--r3);padding:30px;max-width:640px;box-shadow:var(--sh2)}
.qbar{height:7px;background:var(--bg2);border-radius:var(--pill);overflow:hidden;margin-bottom:22px}
.qbar-fill{height:100%;background:linear-gradient(90deg,var(--lv),color-mix(in srgb,var(--lv) 40%,#fff));border-radius:var(--pill);transition:width .4s var(--ease)}
.quiz-progress{font-family:var(--mono);font-size:.78rem;color:var(--soft);margin-bottom:12px;display:flex;justify-content:space-between}
.quiz-q{font-family:var(--sans);font-size:1.28rem;font-weight:600;margin-bottom:22px;line-height:1.4}
.quiz-opts{display:flex;flex-direction:column;gap:11px}
.quiz-opt{text-align:left;padding:15px 19px;font-size:1rem;font-family:var(--serif);background:var(--bg2);
  border:1.5px solid var(--line);border-radius:var(--r2)}
.quiz-opt:hover:not([disabled]){background:var(--card);border-color:color-mix(in srgb,var(--lv) 55%,var(--line));transform:translateX(5px)}
.quiz-opt.correct{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:600;animation:pop .4s var(--ease)}
.quiz-opt.wrong{background:var(--badbg);border-color:var(--bad);color:var(--bad);animation:shake .45s}
.quiz-opt[disabled]{cursor:default}
.quiz-footer{margin-top:22px;display:flex;justify-content:space-between;align-items:center}
.qfb{font-family:var(--sans);font-weight:600;font-size:.92rem}
.small-btn{background:var(--ink);color:#fff;font-size:.86rem;font-weight:600;padding:10px 20px;border-radius:var(--pill)}
.small-btn:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.quiz-result{text-align:center;padding:16px 0}
.result-ring{width:130px;height:130px;border-radius:50%;margin:0 auto 20px;display:grid;place-items:center;position:relative;
  background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--line) 0);animation:pop .6s var(--ease)}
.result-ring::before{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--card)}
.result-ring b{position:relative;font-family:var(--mono);font-size:1.9rem;font-weight:700;color:var(--ok)}
.checklist{margin-top:34px}
.check-item{display:flex;align-items:flex-start;gap:13px;padding:13px 0;border-bottom:1px solid var(--line)}
.check-item input{width:19px;height:19px;accent-color:var(--lv);margin-top:2px;cursor:pointer}
.check-item label{font-size:.95rem;cursor:pointer;line-height:1.5}

/* ================= MOBILE DOCK ================= */
#dock{display:none;position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--rail);
  border-top:1px solid rgba(255,255,255,.12);padding:8px 12px calc(8px + env(safe-area-inset-bottom));}
#dock button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;
  font-size:.68rem;color:var(--rail-mut);border-radius:var(--r1)}
#dock button .ic{font-size:1.15rem}
#dock button.active{color:var(--lv)}

@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}

/* ================= RESPONSIVE ================= */
@media(max-width:880px){
  #app{flex-direction:column}

    {title:"Adjective endings — Dative (once Accusative feels solid)", teach:"Only move on to this once Accusative endings feel automatic. In the Dative, masculine and neuter both take -en, feminine takes -en too, and plural nouns add -n if they don't already end in one.", table:[["dem neuen Laptop","dative, masc./neut."],["der neuen Kamera","dative, fem."],["den neuen Schuhen","dative, plural"]], examples:["Ich gebe dem neuen Kollegen den Laptop."]},

    {title:"Verbs with accusative + dative objects", teach:"Verbs like geben, zeigen and erklären often have two objects: a person (dative) and a thing (accusative). With noun objects, the dative person usually comes first.", table:null, examples:["Ich gebe dem Kunden die Rechnung.","Ich zeige dir das Produkt.","Ich erkläre ihm den Fehler."]},

    {title:"als vs. wenn — the past-tense trap", teach:"als is for one single completed event in the past. wenn is for the present, the future, or anything repeated in the past. Mixing these two up is extremely common — and easy to fix once you know the rule.", table:null, examples:["Als ich in Berlin war, habe ich das Museum besucht. (one time, past)","Wenn ich Zeit habe, gehe ich ins Kino. (present/future)","Immer wenn es regnete, blieb ich zu Hause. (repeated, past)"]},

    {title:"Modal verbs in the Präteritum", teach:"Modal verbs almost always appear in the Präteritum, even in speech — it actually sounds more natural than the Perfekt here. These four are worth memorising as a set.", table:[["ich wollte","I wanted to"],["ich musste","I had to"],["ich konnte","I could"],["ich durfte","I was allowed to"]], examples:["Ich musste die Miete zahlen.","Ich konnte gestern nicht kommen."]},

    {title:"Hedges and distancing expressions", teach:"These small phrases let you report something without asserting it yourself — an essential skill in a critical B2 register.", table:null, examples:["Angeblich hat er das gesagt.","Es heißt, die Lage sei unter Kontrolle.","Man munkelt, dass …"]}
  ],
  drills:[
    {q:"Die Zeitung berichtet, der Minister ___ zurückgetreten.", options:["sei","ist","war","wäre"], answer:"sei"},
    {q:"Er ___ nichts gewusst haben. (he claims)", options:["will","soll","muss","kann"], answer:"will"},
    {q:"Sie ___ sehr talentiert sein. (people say)", options:["soll","will","muss","kann"], answer:"soll"},
    {q:"Er ___ es gewusst haben. (strong conclusion)", options:["muss","soll","will","kann"], answer:"muss"},
    {q:"___ hat er das gesagt.", options:["Angeblich","Anscheinend","Offenbar","Wahrscheinlich"], answer:"Angeblich"}
  ],
  comingLater:["Detailed media-science terminology (framing theory, agenda-setting)","Political propaganda analysis of historical regimes","Statistical literacy in journalism"]
},

    {title:"Genitivpräpositionen — auf Grund, angesichts, hinsichtlich, bezüglich", teach:"These formal prepositions take the genitive and are the standard register in essays, reports and official writing. Learn them as a set — they all mean something close to 'regarding / because of / in view of'.", table:[["aufgrund / wegen","because of"],["angesichts","in view of"],["hinsichtlich","regarding"],["bezüglich","concerning"]], examples:["Aufgrund meiner Herkunft werde ich oft anders wahrgenommen.","Angesichts der wachsenden Migration stellt sich die Frage …","Hinsichtlich der Integration gibt es noch viel zu tun."]},
    {title:"Nominalisierung in formal statements", teach:"Dense nominal phrases are typical of formal writing about migration and society. Recognise them by asking which underlying verb or clause they compress.", table:null, examples:["Bei der Ankunft in einem neuen Land … = Als man in einem neuen Land ankommt …"]}

    {name:"Economy chunks", scope:"Fixed phrases for economic argument", items:[

    {de:"Die Globalisierung hat sowohl Gewinner als auch Verlierer.",en:"weigh up the costs and benefits of globalisation"}
  ],
  grammar:[
    {title:"Reale Bedingungssätze mit sofern, solange, falls, es sei denn", teach:"These four connectors express real conditions — things that could actually happen. Each has its own nuance: sofern (provided that), solange (as long as), falls (in case), es sei denn (unless). Es sei denn is a fixed subjunctive form and introduces an exception.", table:null, examples:["Sofern die Nachfrage steigt, steigen die Preise.","Solange der Staat subventioniert, bleibt der Preis stabil.","Es sei denn, es gibt neue Regeln, wird sich nichts ändern."]},
    {title:"Irreale Bedingungssätze — Konjunktiv II in the present", teach:"When the condition contradicts reality, use Konjunktiv II: wäre, hätte, würde + infinitive, plus the Konjunktiv II of any other verb you need. The wenn-clause sends its verb to the end.", table:null, examples:["Wäre der Handel freier, gäbe es mehr Wohlstand.","Wenn ich mehr Zeit hätte, würde ich das genauer untersuchen."]},
    {title:"Irreale Bedingungssätze in der Vergangenheit", teach:"To say what would have happened if something had been different in the past, combine hätte/wäre + past participle in both clauses. This is one of the most advanced structures you'll produce at B2.", table:null, examples:["Hätte man früher reguliert, wäre die Krise milder gewesen.","Wenn wir mehr investiert hätten, hätten wir jetzt keine Probleme."]}
  ],
  drills:[

    {q:"Hätte man früher reguliert, ___ die Krise milder gewesen.", options:["wäre","würde","ist","war"], answer:"wäre"}
  ],

  grammar:[
    {title:"Irreale Vergleichssätze mit als ob / als wenn / als", teach:"To say how something appears versus how it really is, use als ob or als wenn + Konjunktiv II. The verb goes to the end of the clause. You can also drop ob/wenn and start with the verb right after als, which sounds more literary.", table:null, examples:["Er tut so, als ob er alles wüsste.","Sie tut so, als wäre alles in Ordnung. (als + verb, no ob)","Es sieht so aus, als wenn er müde wäre."]},
    {title:"Konjunktiv II in cautious statements", teach:"In sensitive contexts, Konjunktiv II lets you soften what you say — 'it would seem', 'one could say', 'it might be'. This is exactly the register you need for psychological and personal topics.", table:null, examples:["Man könnte sagen, dass …","Es wäre denkbar, dass …","Ich würde vermuten, dass …"]},
    {title:"Weil, obwohl, sodass — a quick review in a new context", teach:"Subordinate connectors behave the same way in psychological texts as anywhere else: they send the conjugated verb to the end. Recognising this lets you parse longer, more complex sentences about causes, contrasts and results.", table:null, examples:["Er wirkt erschöpft, obwohl er das nicht zugeben würde.","Sie arbeitet weniger, sodass sie sich besser erholen kann."]}
  ],
  drills:[

  grammar:[
    {title:"Passiv mit Modalverben in allen Zeitformen", teach:"Legal and formal German relies on this pattern constantly. Drill it as a single block so the three tenses stay separate in your head.", table:[["Präsens: muss geklärt werden","has to be clarified"],["Präteritum: musste geklärt werden","had to be clarified"],["Perfekt: hat geklärt werden müssen","has had to be clarified"]], examples:["Der Sachverhalt muss noch geklärt werden.","Die Unterlagen haben eingereicht werden müssen."]},
    {title:"Passiversatzformen — the three main alternatives", teach:"German often prefers an active-sounding substitute over a heavy passive. Three go-to forms cover almost all cases: sich lassen + infinitive, sein + zu + infinitive, and the Zustandspassiv (sein + past participle).", table:[["Das lässt sich klären.","It can be clarified."],["Das ist zu klären.","It is to be clarified."],["Das ist geklärt.","It is clarified (state)."]], examples:["Diese Forderung lässt sich nicht durchsetzen.","Der Vertrag ist bis Ende des Jahres zu erfüllen.","Der Fall ist bereits abgeschlossen."]},
    {title:"Funktionsverbgefüge im Recht", teach:"Legal German is full of fixed verb+noun combinations. Learn these as chunks — they rarely translate word-for-word.", table:[["einen Antrag stellen","to file an application"],["einen Einspruch einlegen","to lodge an objection"],["zur Verantwortung ziehen","to hold to account"],["in Kraft treten","to come into force"]], examples:["Der Anwalt legte Einspruch ein.","Das Gesetz trat letzte Woche in Kraft."]}
  ],

  grammar:[
    {title:"Erweiterte Partizipialattribute auflösen", teach:"Literary and academic German packs entire relative clauses in front of nouns as extended participle phrases. The skill is unpacking them — move the phrase after the noun and turn it into a relative clause to work out what it means.", table:null, examples:["die in diesem Roman dargestellte Gesellschaft = die Gesellschaft, die in diesem Roman dargestellt wird","der vom Autor gewählte Ton = der Ton, den der Autor gewählt hat"]},
    {title:"Genitivattribute", teach:"Formal literary German uses the genitive heavily for possession and description. Learn to spot it, and to swap it for a von-phrase when speaking — both mean the same thing, in different registers.", table:null, examples:["die Sprache des Autors = die Sprache von dem Autor","die Wirkung des Textes = die Wirkung von dem Text"]},
    {title:"Konjunktiv II für vorsichtige Interpretation", teach:"Literary interpretation is full of hedged claims. Konjunktiv II keeps you honest — you're proposing an interpretation, not asserting a fact.", table:null, examples:["Man könnte den Text als Kritik lesen.","Es ließe sich argumentieren, dass …","Das wäre eine mögliche Deutung."]}

 h+=`<button onclick="goCEFR()"><span class="ic">▦</span>Levels</button>`;
 d.innerHTML=h;
}

function renderCEFR(){
 const cards=LEVELS.map((l,i)=>{const dis=!l.available;
  return `<button class="cefr-card ${dis?'disabled':''} reveal" style="--lv:${l.accent};--i:${i}" ${dis?'':`onclick="goLevel('${l.code}')"`}>
   <span class="wm">${esc(l.label)}</span>
   <span class="cefr-letter">${esc(l.label)}</span>
   <span class="cefr-title">${esc(l.title)}</span>
   <span class="cefr-blurb">${esc(l.blurb)}</span>
   <span class="cefr-foot"><span class="cefr-words">${esc(l.words)}</span><span class="badge ${dis?'soon':'go'}">${dis?'Coming soon':'Start →'}</span></span>
  </button>`}).join("");
 document.getElementById("main").innerHTML=`
  <div class="cefr-hero reveal"><div class="kicker">Deutsch Trainer · A1 → C2</div>
   <h1>Sprich Deutsch,<br><em>Schritt für Schritt.</em></h1>
   <p>Choose your level to begin. Each level has its own chapters, vocabulary, grammar lessons and practice quizzes — and builds on the one before it.</p></div>
  <div class="cefr-grid">${cards}</div>
  <footer class="foot">Sprachheft · your progress is saved for this session</footer>`;
}

function renderHome(){
 const l=getLevel(state.level);
 const total=l.chapters.reduce((s,c)=>s+c.categories.reduce((a,cat)=>a+cat.items.length,0),0);
 const avg=Math.round(l.chapters.reduce((s,c)=>s+chapterPct(state.level,c),0)/l.chapters.length);
 const cards=l.chapters.map((c,i)=>{const p=chapterPct(state.level,c);
  return `<button class="chapter-card reveal" style="--i:${i}" onclick="goChapter(${c.id})">
   <span class="cnum">KAPITEL ${String(c.id).padStart(2,'0')}</span>
   <span class="ctitle-de">${esc(c.titleDe)}</span><span class="ctitle-en">${esc(c.titleEn)}</span>
   <span class="cfoot"><span class="quota-pill">${c.quota} Wörter</span>
   <span class="ring ${p>=80?'done':''}" style="--p:${p}"><span>${p}%</span></span></span>
  </button>`}).join("");
 let passiveBlock = "";
 if(l.passive){
   passiveBlock = `
   <div class="section-title">Words you'll meet but don't need to produce</div>
   <p class="section-note">These show up in listening or reading, just so nothing feels totally unfamiliar — you're never tested on them.</p>
   <div class="passive-box">
     <ul>${l.passive.map(p=>`<li><strong>${esc(p.de)}</strong> — ${esc(p.en)}</li>`).join("")}</ul>
   </div>`;
 }
 document.getElementById("main").innerHTML=`
  <div class="lhero reveal"><span class="wm">${esc(l.label)}</span>
   <div class="kicker">${esc(l.label)} · ${esc(l.title)}</div>
   <h1>${esc(l.label)} Deutsch</h1><p>${esc(l.blurb)}</p>
   <div class="stats">
    <div class="stat-pill"><b>${total}</b><span>words in this level</span></div>
    <div class="stat-pill"><b>${l.chapters.length}</b><span>chapters</span></div>
    <div class="stat-pill"><b>${avg}%</b><span>your progress</span></div>
   </div></div>
  ${passiveBlock}
  <div class="section-title">Chapters</div>
  <div class="chapter-grid">${cards}</div>
  <footer class="foot">Sprachheft · ${esc(l.label)} Deutsch Trainer</footer>`;
}

function renderChapter(){
 const l=getLevel(state.level),c=l.chapters.find(x=>x.id===state.view);
 document.getElementById("main").innerHTML=`
  <div class="chead reveal">
   <div class="eyebrow">${esc(l.label)} · KAPITEL ${String(c.id).padStart(2,'0')} · ${c.quota} WÖRTER</div>
   <h1>${esc(c.titleDe)}</h1><div class="sub">${esc(c.titleEn)}</div>
   <p class="goal">${esc(c.goal)}</p>
  </div>
  <div class="subtabs reveal" style="--i:1">
   <button class="subtab ${state.subtab==='vocab'?'active':''}" onclick="setSubtab('vocab')">Wortschatz</button>
   <button class="subtab ${state.subtab==='grammar'?'active':''}" onclick="setSubtab('grammar')">Grammatik</button>
   <button class="subtab ${state.subtab==='practice'?'active':''}" onclick="setSubtab('practice')">Übung</button>
  </div>
  <div id="sub"></div>`;
 const t=document.getElementById("sub");
 if(state.subtab==="vocab")t.innerHTML=vocabHTML(c);
 else if(state.subtab==="grammar"){t.innerHTML=grammarHTML(c);wireDrill(c)}
 else{t.innerHTML=practiceHTML(c);wireQuiz(c)}
}

function vocabHTML(c){
 return c.categories.map((cat,ci)=>`
  <div class="vocab-cat reveal" style="--i:${ci}">
   <div class="vocab-cat-head"><h3>${esc(cat.name)}</h3><span class="count">${cat.items.length} Wörter</span></div>
   <div class="card-row">${cat.items.map((it,i)=>`
    <div class="vcard" style="--i:${i}" onclick="this.classList.toggle('flipped')">
     <div class="vcard-inner"><div class="vface front">${esc(it.de)}</div><div class="vface back">${esc(it.en)}</div></div>
    </div>`).join("")}</div>
  </div>`).join("");
}

function grammarHTML(c){
 return `
 <div class="section-title">What's new in this chapter</div>
 <p class="section-note">Read each short lesson, look at the examples, then try the practice quiz at the bottom.</p>
 ${c.grammar.map((g,i)=>`
  <div class="gram-card reveal" style="--i:${i}"><span class="gnum">${String(i+1).padStart(2,'0')}</span>
   <h4>${esc(g.title)}</h4><p>${esc(g.teach)}</p>
   ${g.table?`<table class="gram-table"><tbody>${g.table.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("")}</tbody></table>`:""}
   ${g.examples.length?`<div class="ex">${g.examples.map(e=>esc(e)).join("<br>")}</div>`:""}
  </div>`).join("")}
 <div class="section-title">Grammatik-Check</div>
 <p class="section-note">A short quiz on exactly what you just read.</p>
 <div class="practice-menu"><button class="btn-primary" id="startDrill">Grammatik-Check starten (${c.drills.length} Fragen)</button></div>
 <div id="drillArea"></div>
 <div class="excl-box reveal"><h4>Coming in a later chapter</h4>
  <ul>${c.comingLater.map(e=>`<li>${esc(e)}</li>`).join("")}</ul></div>`;
}
function wireDrill(c){
 const b=document.getElementById("startDrill");
 if(b)b.onclick=()=>{state.drillQuiz=buildDrill(c);renderDrill(c)};
 if(state.drillQuiz)renderDrill(c);
}
function buildDrill(c){return{questions:shuffle(c.drills).map(d=>({prompt:d.q,correct:d.answer,options:shuffle(d.options)})),index:0,score:0,answered:false}}
function renderDrill(c){
 const a=document.getElementById("drillArea");if(!a)return;const q=state.drillQuiz;
 if(q.index>=q.questions.length){const p=Math.round(q.score/q.questions.length*100);ensureProgress(state.level)[c.id].drillPct=p;
  a.innerHTML=`<div class="quiz-box quiz-result"><div class="result-ring" style="--p:${p}"><b>${p}%</b></div>
   <p>${q.score} von ${q.questions.length} richtig.</p>
   <button class="small-btn" onclick="state.drillQuiz=buildDrill(getLevel(state.level).chapters.find(x=>x.id===${c.id}));renderDrill(getLevel(state.level).chapters.find(x=>x.id===${c.id}))">Nochmal üben</button></div>`;return}
 const cur=q.questions[q.index],pw=(q.index/q.questions.length)*100;
 a.innerHTML=`<div class="quiz-box"><div class="quiz-progress"><span>Frage ${q.index+1} / ${q.questions.length}</span><span>Punkte: ${q.score}</span></div>
  <div class="qbar"><div class="qbar-fill" style="width:${pw}%"></div></div>
  <div class="quiz-q">${esc(cur.prompt)}</div>
  <div class="quiz-opts">${cur.options.map(o=>`<button class="quiz-opt" data-opt="${esc(o)}" onclick="answerDrill(${c.id},this)">${esc(o)}</button>`).join("")}</div>
  <div class="quiz-footer"><span class="qfb" id="drillFB"></span><button class="small-btn" id="drillNext" style="display:none" onclick="nextDrill(${c.id})">Weiter →</button></div></div>`;
}
function answerDrill(cid,el){const q=state.drillQuiz;if(q.answered)return;q.answered=true;
 const chosen=el.getAttribute("data-opt"),cur=q.questions[q.index];
 document.querySelectorAll("#drillArea .quiz-opt").forEach(o=>{o.setAttribute("disabled","true");
  if(o.getAttribute("data-opt")===cur.correct)o.classList.add("correct");else if(o===el)o.classList.add("wrong")});
 const fb=document.getElementById("drillFB");
 if(chosen===cur.correct){q.score++;fb.textContent="Richtig!";fb.style.color="var(--ok)"}else{fb.textContent="Nicht ganz — richtig markiert.";fb.style.color="var(--bad)"}
 document.getElementById("drillNext").style.display="inline-block"}
function nextDrill(cid){const c=getLevel(state.level).chapters.find(x=>x.id===cid);state.drillQuiz.index++;state.drillQuiz.answered=false;renderDrill(c)}

function practiceHTML(c){
 const p=ensureProgress(state.level)[c.id];
 return `<div class="section-title">Wortschatz-Quiz</div>
 <p class="section-note">Multiple choice on this chapter's vocabulary.</p>
 <div class="practice-menu"><button class="btn-primary" id="startQuiz">Quiz starten</button></div>
 <div id="quizArea"></div>
 <div class="checklist"><div class="section-title">Was du jetzt sagen kannst</div>
 <p class="section-note">Tick these off as you get comfortable saying them.</p>
 ${c.functions.map((f,i)=>{const ck=!!p.checklist[i];
  return `<div class="check-item"><input type="checkbox" id="chk-${c.id}-${i}" ${ck?'checked':''} onchange="toggleCheck(${c.id},${i},this.checked)">
   <label for="chk-${c.id}-${i}"><span style="font-family:var(--mono);font-size:.88rem">${esc(f.de)}</span> — ${esc(f.en)}</label></div>`}).join("")}</div>`;
}
function toggleCheck(cid,i,v){ensureProgress(state.level)[cid].checklist[i]=v}
function buildQuiz(c){const all=c.categories.flatMap(x=>x.items);const n=Math.max(6,Math.round(all.length*.5));
 const chosen=pick(all,Math.min(n,all.length));
 return{questions:chosen.map(it=>{const wrongs=pick(all.filter(x=>x.en!==it.en),3).map(x=>x.en);
  return{prompt:it.de,correct:it.en,options:shuffle([it.en,...wrongs])}}),index:0,score:0,answered:false}}
function wireQuiz(c){const b=document.getElementById("startQuiz");if(b)b.onclick=()=>{state.quiz=buildQuiz(c);renderQuiz(c)};if(state.quiz)renderQuiz(c)}
function renderQuiz(c){const a=document.getElementById("quizArea"),q=state.quiz;
 if(q.index>=q.questions.length){const p=Math.round(q.score/q.questions.length*100);ensureProgress(state.level)[c.id].quizPct=p;
  a.innerHTML=`<div class="quiz-box quiz-result"><div class="result-ring" style="--p:${p}"><b>${p}%</b></div>
   <p>${q.score} von ${q.questions.length} richtig.</p>
   <button class="small-btn" onclick="state.quiz=buildQuiz(getLevel(state.level).chapters.find(x=>x.id===${c.id}));renderQuiz(getLevel(state.level).chapters.find(x=>x.id===${c.id}))">Nochmal üben</button></div>`;return}
 const cur=q.questions[q.index],pw=(q.index/q.questions.length)*100;
 a.innerHTML=`<div class="quiz-box"><div class="quiz-progress"><span>Frage ${q.index+1} / ${q.questions.length}</span><span>Punkte: ${q.score}</span></div>
  <div class="qbar"><div class="qbar-fill" style="width:${pw}%"></div></div>
  <div class="quiz-q">${esc(cur.prompt)}</div>
  <div class="quiz-opts">${cur.options.map(o=>`<button class="quiz-opt" data-opt="${esc(o)}" onclick="answerQuiz(${c.id},this)">${esc(o)}</button>`).join("")}</div>
  <div class="quiz-footer"><span class="qfb" id="quizFB"></span><button class="small-btn" id="nextBtn" style="display:none" onclick="nextQuiz(${c.id})">Weiter →</button></div></div>`}
function answerQuiz(cid,el){const q=state.quiz;if(q.answered)return;q.answered=true;
 const chosen=el.getAttribute("data-opt"),cur=q.questions[q.index];
 document.querySelectorAll("#quizArea .quiz-opt").forEach(o=>{o.setAttribute("disabled","true");
  if(o.getAttribute("data-opt")===cur.correct)o.classList.add("correct");else if(o===el)o.classList.add("wrong")});
 const fb=document.getElementById("quizFB");
 if(chosen===cur.correct){q.score++;fb.textContent="Richtig!";fb.style.color="var(--ok)"}else{fb.textContent="Nicht ganz — richtig markiert.";fb.style.color="var(--bad)"}
 document.getElementById("nextBtn").style.display="inline-block"}
function nextQuiz(cid){const c=getLevel(state.level).chapters.find(x=>x.id===cid);state.quiz.index++;state.quiz.answered=false;renderQuiz(c)}

function render(){renderRail();if(state.level===null){renderCEFR();return}if(state.view==="home"){renderHome();return}renderChapter()}
render();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('/sw.js').catch(()=>{});
  });
}

</script>
</body>
</html>
